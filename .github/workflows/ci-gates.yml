name: CI Gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/ci/gate-lint.sh

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/ci/gate-typecheck.sh

  unit:
    name: Unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/ci/gate-unit.sh

  design-system:
    name: Design System Sync
    runs-on: ubuntu-latest
    needs:
      - lint
      - typecheck
      - unit
    timeout-minutes: 20
    env:
      STITCH_API_KEY: ${{ secrets.STITCH_API_KEY }}
      STITCH_OAUTH_ACCESS_TOKEN: ${{ secrets.STITCH_OAUTH_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/ci/gate-design-system.sh

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs:
      - lint
      - typecheck
      - unit
      - design-system
    timeout-minutes: 20
    env:
      CI: true
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: bash scripts/ci/gate-e2e.sh

  a11y:
    name: A11y
    runs-on: ubuntu-latest
    needs:
      - lint
      - typecheck
      - unit
      - design-system
    timeout-minutes: 20
    env:
      CI: true
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: bash scripts/ci/gate-a11y.sh

  perf:
    name: Perf
    runs-on: ubuntu-latest
    needs:
      - lint
      - typecheck
      - unit
      - design-system
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/ci/gate-perf.sh
